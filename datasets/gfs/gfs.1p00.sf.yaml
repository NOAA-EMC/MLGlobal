mover:
  name: mpidatamover

directories:
  zarr: gfs-1p00-13pl-20210401-20260331-6h-snowfall.zarr
  cache: cache/1p00/sf
  logs: logs/1p00/sf

source:
  name: gfs_archive
  t0:
    start: 2021-04-01T00
    end: 2026-03-31T18
    freq: 6h

  fhr:
    start: 0
    end: 6
    step: 6

  resolution: 1p00

  variables:
    # 2D Atmospheric Variables
    - sdwe #Water equivalent of accumulated snow depth (deprecated)

transforms:
  divide:
    sdwe: 1000 #kg/m^2 to m
  

target:
  name: forecast
  rename:
    sdwe: sf

  chunks:
    t0: 1
    fhr: 1
    latitude: -1
    longitude: -1

attrs:
  description: "NOAA GFS archived on AWS"
